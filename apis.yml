name: Twelve
description: Twelve is a carbon transformation company that converts CO2, water, and
  renewable electricity into fuels and chemicals that serve as drop-in replacements
  for petroleum-based products. Its proprietary eManufacturing technology powers AirPlant
  One in Moses Lake, Washington, which produces E-Jet sustainable aviation fuel and
  E-Naphtha, while its eMade program partners with consumer brands on CO2-made materials.
  Investors include TPG, DCVC, Microsoft, Carbon Direct, Breakout Ventures, and the
  Chan Zuckerberg Initiative. Twelve publishes no public developer API, but its Wix-hosted
  site exposes an llms.txt and a live site MCP endpoint for agentic access.
